# Integration example: how mcp-guard fits into the CI of an MCP server repository.
# The workflow fails the pull request on any high or critical finding, writes the
# report to the job summary and shows every finding in the Security tab (Code scanning).
name: mcp-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload SARIF to code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Build your server first, e.g. npm ci && npm run build.

      # This is a security tool in your pipeline: consider pinning a full commit SHA
      # instead of the moving v1 tag.
      - name: Scan the server
        id: mcp-guard
        uses: diegoperezg7/mcp-guard@v1
        with:
          stdio: node dist/server.js
          fail-on: high
          sarif-file: mcp-guard.sarif

      # The action writes SARIF; uploading it is a separate step, so it also runs
      # when the scan step fails on findings.
      - name: Upload SARIF
        if: ${{ !cancelled() && steps.mcp-guard.outputs.sarif-file != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.mcp-guard.outputs.sarif-file }}
          category: mcp-guard
