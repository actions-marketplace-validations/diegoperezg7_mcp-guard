name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The HTML report tests open it in a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - name: Check that the committed action bundle is up to date
        run: |
          npm run build:action
          if [ -n "$(git status --porcelain -- dist/action)" ]; then
            echo "::error title=stale bundle::dist/action does not match the source. Run npm run build:action and commit the result."
            git status --short -- dist/action
            exit 1
          fi

  # Scans the bundled demo servers and shows the report in the job summary.
  # The demos are vulnerable on purpose, so this job reports but never fails the build.
  scan-examples:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Start the HTTP demo server
        run: |
          HOST=0.0.0.0 PORT=3401 node dist/examples/ops-toolbox.js &
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:3401/mcp && break; sleep 0.5; done

      - name: Scan
        run: >
          node dist/cli/index.js scan
          --stdio "node --import tsx examples/servers/poisoned-notes.ts"
          --http http://127.0.0.1:3401/mcp
          --json examples/exports/mail-server.json
          --probe
          --fail-on none
          --format markdown
          --output sarif:mcp-guard.sarif
          >> "$GITHUB_STEP_SUMMARY"

      # The demo servers are vulnerable on purpose, so their SARIF is kept as an
      # artifact instead of being uploaded to this repository's code scanning.
      - name: Keep the demo SARIF
        uses: actions/upload-artifact@v5
        with:
          name: mcp-guard-demo-sarif
          path: mcp-guard.sarif
